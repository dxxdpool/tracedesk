[project]
name = "tracedesk-cli"
version = "0.1.0"
description = "st: the command line agents and humans use to talk to the TraceDesk Evidence Ledger"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.3",
]

[project.scripts]
st = "st.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["st"]
