services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracedesk}
      POSTGRES_DB: ${POSTGRES_DB:-tracedesk}
    ports:
      # 5433 on the host: 5432 is taken by a native Postgres, and Switch runs its own Postgres too.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
