services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracedesk}
      POSTGRES_DB: ${POSTGRES_DB:-tracedesk}
    ports:
      # 5433 on the host: 5432 is taken by a native Postgres, and Switch runs its own Postgres too.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      # Inside the compose network Postgres is "postgres:5432", not localhost:5433.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracedesk}:${POSTGRES_PASSWORD:-tracedesk}@postgres:5432/${POSTGRES_DB:-tracedesk}
      # Required: the API refuses to start without three distinct tokens.
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      VALIDATOR_TOKEN: ${VALIDATOR_TOKEN:?set VALIDATOR_TOKEN in .env}
      APPROVER_TOKEN: ${APPROVER_TOKEN:?set APPROVER_TOKEN in .env}
      # Clones go to ./workspaces on the host, where agents read them and `st` mounts them into
      # the sandbox. The API only needs to know the host path to print it.
      WORKSPACES_DIR: /workspaces
      WORKSPACES_HOST_DIR: ${WORKSPACES_HOST_DIR:?set WORKSPACES_HOST_DIR in .env}
      ALLOW_LOCAL_REPOS: ${ALLOW_LOCAL_REPOS:-0}
      LOCAL_REPOS_DIR: /cases
    volumes:
      - ./workspaces:/workspaces
      - ./eval/cases:/cases:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
