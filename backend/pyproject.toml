[project]
name = "tracedesk-backend"
version = "0.1.0"
description = "TraceDesk Evidence Ledger API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # The st CLI, so tests/test_cli.py can drive it against the in-process API.
    "tracedesk-cli",
]

[tool.uv]
package = false

[tool.uv.sources]
tracedesk-cli = { path = "../cli", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
